const active=new Set(Object.keys(CAT_COLORS));
let hoverIdx=-1,scale=1,offX=0,offY=0,worldW=1,worldH=1,dragging=false,lastMx=0,lastMy=0;
const canvas=document.getElementById('main-canvas'),ctx=canvas.getContext('2d');

function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function d2s(x,y){return[offX+(x+1)*0.5*worldW*scale,offY+(1-(y+1)*0.5)*worldH*scale];}
function fitAll(){
  const W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  const P=55;worldW=W-2*P;worldH=H-2*P;scale=1;offX=P;offY=P;
}

// 是否是兜底系列（不画圆）
function isOther(sname){return sname.startsWith('其他')||sname==='市井百态';}

function draw(){
  const W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  const dpr=devicePixelRatio;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);

  // 网格
  ctx.save();ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;
  [-0.5,0,0.5].forEach(v=>{
    const[x0,y0]=d2s(v,-1.1),[x1,y1]=d2s(v,1.1);
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
    const[x2,y2]=d2s(-1.1,v),[x3,y3]=d2s(1.1,v);
    ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x3,y3);ctx.stroke();
  });ctx.restore();

  // 包络圆（跳过"其他"和市井百态）
  const du=worldW*scale/2;
  Object.entries(HULLS).forEach(([sname,h])=>{
    if(isOther(sname)||h.n<3)return;
    const cat=SC[sname];if(!active.has(cat))return;
    const col=CAT_COLORS[cat]||'#999',[cx,cy]=d2s(h.cx,h.cy),r=h.r*du;
    if(r<3||r>W*0.9)return;
    ctx.save();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=col+'0C';ctx.fill();
    ctx.strokeStyle=col+'75';ctx.lineWidth=1.5;
    ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    const fs=Math.max(9,Math.min(12,10.5*Math.min(scale*0.9,1.4)));
    ctx.font=`600 ${fs}px PingFang SC,sans-serif`;ctx.fillStyle=col;
    const tw=ctx.measureText(sname).width,ly=cy-r-5;
    ctx.fillText(sname,cx-tw/2,ly>12?ly:cy+r+13);
    ctx.restore();
  });

  // 散点
  const R=Math.max(2,3.5*Math.min(scale,2));
  PTS.forEach((p,i)=>{
    if(!active.has(p.c))return;
    const[sx,sy]=d2s(p.x,p.y);
    if(sx<-R||sx>W+R||sy<-R||sy>H+R)return;
    const col=CAT_COLORS[p.c]||'#999',[r2,g2,b2]=hex2rgb(col),isHov=i===hoverIdx;
    ctx.beginPath();ctx.arc(sx,sy,isHov?R*2.2:R,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r2},${g2},${b2},${isHov?1:0.65})`;ctx.fill();
    if(isHov){ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();}
  });
}

// 图例
const legDiv=document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat,col])=>{
  const el=document.createElement('div');el.className='leg-item';
  el.innerHTML=`<span class="leg-dot" style="background:${col}"></span>${cat}(${CC[cat]||0})`;
  el.onclick=()=>{if(active.has(cat))active.delete(cat);else active.add(cat);el.classList.toggle('off',!active.has(cat));draw();};
  legDiv.appendChild(el);
});

// Hover
canvas.addEventListener('mousemove',e=>{
  if(dragging)return;
  const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let best=-1,bestD=14;
  PTS.forEach((p,i)=>{
    if(!active.has(p.c))return;
    const[sx,sy]=d2s(p.x,p.y);
    const d=Math.sqrt((sx-mx)**2+(sy-my)**2);
    if(d<bestD){bestD=d;best=i;}
  });
  if(best!==hoverIdx){hoverIdx=best;draw();}
  if(best>=0){
    const p=PTS[best];
    tooltip.style.display='block';
    tooltip.style.left=(e.clientX+14)+'px';
    tooltip.style.top=(e.clientY-10)+'px';
    tooltip.innerHTML=`<b>${p.t}</b><br><span style="color:${CAT_COLORS[p.c]}">${p.c}</span><br><span style="opacity:.65">${p.s}</span>`;
    statusEl.textContent=`${p.t} · ${p.c} · ${p.s}`;
  }else{
    tooltip.style.display='none';statusEl.textContent='悬停查看剧名';
  }
});

// 拖拽
canvas.addEventListener('mousedown',e=>{dragging=true;lastMx=e.clientX;lastMy=e.clientY;canvas.classList.add('dragging');});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  offX+=e.clientX-lastMx;offY+=e.clientY-lastMy;
  lastMx=e.clientX;lastMy=e.clientY;
  hoverIdx=-1;tooltip.style.display='none';draw();
});
window.addEventListener('mouseup',()=>{dragging=false;canvas.classList.remove('dragging');});

// 滚轮
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const f=e.deltaY<0?1.15:1/1.15;
  offX=mx-(mx-offX)*f;offY=my-(my-offY)*f;scale*=f;draw();
},{passive:false});

canvas.addEventListener('dblclick',()=>{fitAll();draw();});
const ro=new ResizeObserver(()=>{fitAll();draw();});ro.observe(canvas);
fitAll();draw();
</script>
</body>
</html>
